version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: hipl_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: hipl_db
      MYSQL_USER: hipl_user
      MYSQL_PASSWORD: HIPL_SecurePass2026
      TZ: Asia/Kolkata
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - hipl_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hipl_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hipl_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  # N8N Workflow Engine
  n8n:
    image: n8nio/n8n:latest
    container_name: hipl_n8n
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin@HIPL2026
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      DATABASE_TYPE: mysql
      DATABASE_MYSQL_HOST: mysql
      DATABASE_MYSQL_PORT: 3306
      DATABASE_MYSQL_DATABASE: n8n_db
      DATABASE_MYSQL_USER: hipl_user
      DATABASE_MYSQL_PASSWORD: HIPL_SecurePass2026
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hipl_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hipl_backend
    environment:
      DATABASE_URL: mysql+pymysql://hipl_user:HIPL_SecurePass2026@mysql:3306/hipl_db
      REDIS_URL: redis://redis:6379/0
      N8N_URL: http://n8n:5678
      JWT_SECRET_KEY: your-super-secret-jwt-key-change-this-in-production-minimum-32-characters
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_started
    networks:
      - hipl_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hipl_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - hipl_network
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_N8N_URL: http://localhost:5678
    command: npm run dev

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: hipl_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
      - n8n
    networks:
      - hipl_network

volumes:
  mysql_data:
  redis_data:
  n8n_data:

networks:
  hipl_network:
    driver: bridge
